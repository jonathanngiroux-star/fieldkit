name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race on the concurrent packages)
        run: go test -race ./internal/store/ ./internal/serve/
      - name: test (all, incl. TUI sim-screen suites)
        run: go test ./...
      - name: build
        run: go build -o fieldkit ./cmd/fieldkit
      # Migrate fixture gate: the dry-run report on the committed
      # Typeform fixture must stay machine-stable.
      - name: migrate fixture gate (typeform)
        run: |
          ./fieldkit migrate --from=typeform --dry-run --format=json \
            --input testdata/fixtures/typeform/sample-export.json > /tmp/report.json
          jq -e '.source=="typeform" and .dry_run==true
                 and (.survey.questions | length)==4
                 and (.unmapped | length)==3
                 and (.endings | length)==1
                 and (.survey.logic | length)==1' /tmp/report.json
      # Plugin contract gate: the sample plugin must pass or the build fails.
      - name: plugin contract gate
        run: ./fieldkit plugin validate testdata/plugins/sample
      # Donate-exact gate: both addresses byte-for-byte, exactly once each.
      - name: donate exact gate
        run: |
          ./fieldkit donate > /tmp/donate.txt
          grep -Fx 'Ethereum / USDC (ERC-20): 0x85ee7E71f762d772599cbF1EC20E651B30657521' /tmp/donate.txt
          grep -Fx 'Bitcoin:                  bc1qxe2zx5tv3hdreaej6s2x4p7han85uey828rrhg' /tmp/donate.txt
      # Logic fixture gate: the branch fixture's evaluation is stable.
      - name: logic fixture gate
        run: |
          echo '{"q1":"no","q2":"x","q3":"y"}' > /tmp/answers.json
          ./fieldkit logic --survey testdata/logic/branch.json \
            --answers /tmp/answers.json --format=json > /tmp/logic.json
          jq -e '(.visible_questions | length)==3 and (.errors | length)==0' /tmp/logic.json
      # Docker: the image must build from a clean tree.
      - name: docker build
        run: docker build -t fieldkit-ci .

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # The wails-tagged desktop GUI must compile (webkit2gtk on the
      # runner). Without this step the tagged source rots silently.
      - name: install desktop build deps (webkit2gtk-4.1)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      # wails.json + the root main package make `wails build` the
      # canonical desktop build; it must produce a binary.
      - name: wails build (desktop binary)
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          wails build -tags "wails webkit2_41"
          test -x build/bin/fieldkit-desktop
      # The CLI binary must also still carry the desktop command.
      - name: desktop build compiles (wails tag, CLI path)
        run: CGO_ENABLED=1 go build -tags "wails production webkit2_41" -o /tmp/fieldkit-desktop ./cmd/fieldkit
